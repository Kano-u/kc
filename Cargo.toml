[package]
name = "kc"
version = "0.1.0"
edition = "2021"
description = "Shell history notes and search TUI backed by Atuin"
license = "MIT"

[dependencies]
crossterm = "0.28"
ratatui = "0.29"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
