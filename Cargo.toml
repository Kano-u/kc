[package]
name = "kc"
version = "0.1.0"
edition = "2021"
description = "Shell history notes and search TUI"
license = "MIT"

[dependencies]
crossterm = "0.28"
ratatui = "0.29"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
